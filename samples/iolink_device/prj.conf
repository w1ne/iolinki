CONFIG_IOLINKI=y

# Default to the virtual PHY so the sample builds and runs on native_sim out of
# the box. For real hardware, build with the UART PHY, e.g.:
#   west build -b nucleo_l476rg samples/iolink_device -- -DCONFIG_IOLINK_PHY_UART=y
CONFIG_IOLINK_PHY_VIRTUAL=y

# A small fixed-PD M-sequence makes the device produce process data each cycle.
CONFIG_IOLINK_M_SEQ_DEFAULT_TYPE_1_1=y

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
