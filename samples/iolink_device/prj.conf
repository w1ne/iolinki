CONFIG_IOLINKI=y

# The PHY is chosen automatically by target: the virtual PHY on native_sim/POSIX
# (host simulation) and the UART PHY on real hardware (see zephyr/Kconfig). No
# explicit CONFIG_IOLINK_PHY_* is needed here; override only to force a choice.

# A small fixed-PD M-sequence makes the device produce process data each cycle.
CONFIG_IOLINK_M_SEQ_DEFAULT_TYPE_1_1=y

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
